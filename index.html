<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const params=new URLSearchParams(window.location.search);
const IS_DEMO=params.has('demo');
const IS_OPEN=params.has('open');
const NORMAL_TARGET=Date.parse('2026-09-28T00:00:00+04:00');
const EFFECT_WPM=40;
const POEM_WPM=50;
const MUSIC_FILE='music.mp3';
let targetTime=NORMAL_TARGET;
let started=false;
let countdownTimer=null;
let audio=null;
let playing=false;
let petalsOn=false;
let lastBigSecond=null;
let W=innerWidth;
let H=innerHeight;
if(IS_DEMO&&!IS_OPEN)targetTime=Date.now()+10000;
function resize(){
W=innerWidth;
H=innerHeight;
$('fx').width=W;
$('fx').height=H;
}
resize();
addEventListener('resize',resize);
const ctx=$('fx').getContext('2d');
const colors=['#ff8fb3','#ff5e94','#ffd166','#c9a7f0','#ffffff','#f7c6d9'];
const stars=Array.from({length:75},()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.5,p:Math.random()*6}));
const petals=Array.from({length:35},()=>({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*8,v:.5+Math.random()*1.2,r:Math.random()*360,rv:-1+Math.random()*2}));
let parts=[];
function burst(x,y,count=50,speed=5){
for(let i=0;i<count;i++){
const angle=Math.random()*Math.PI*2;
const velocity=Math.random()*speed+1;
parts.push({x:x,y:y,vx:Math.cos(angle)*velocity,vy:Math.sin(angle)*velocity,life:1,c:colors[Math.floor(Math.random()*colors.length)],s:1+Math.random()*3});
}
}
function confetti(x,y){
for(let i=0;i<120;i++){
parts.push({x:x,y:y,vx:(Math.random()-.5)*14,vy:-Math.random()*15-3,life:1.7,c:colors[Math.floor(Math.random()*colors.length)],s:4+Math.random()*5,g:.25,rect:true});
}
}
function fireworks(count=5){
for(let i=0;i<count;i++){
setTimeout(()=>burst(W*(.1+Math.random()*.8),H*(.12+Math.random()*.42),55,6),i*220);
}
}
function animationLoop(time){
ctx.clearRect(0,0,W,H);
stars.forEach(star=>{
ctx.globalAlpha=.2+.5*Math.abs(Math.sin(time/1000+star.p));
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(star.x*W,star.y*H,star.r,0,Math.PI*2);
ctx.fill();
});
if(petalsOn){
petals.forEach(p=>{
p.y+=p.v;
p.x+=Math.sin(time/900+p.r)*.35;
p.r+=p.rv;
if(p.y>H+20){
p.y=-20;
p.x=Math.random()*W;
}
ctx.save();
ctx.translate(p.x,p.y);
ctx.rotate(p.r*Math.PI/180);
ctx.globalAlpha=.7;
ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
ctx.beginPath();
ctx.ellipse(0,0,p.s*.5,p.s,Math.PI/4,0,Math.PI*2);
ctx.fill();
ctx.restore();
});
}
parts=parts.filter(p=>p.life>0);
parts.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.vy+=p.g||.05;
p.vx*=.985;
p.life-=.014;
ctx.globalAlpha=Math.max(0,p.life);
ctx.fillStyle=p.c;
if(p.rect){
ctx.fillRect(p.x,p.y,p.s,p.s*.6);
}else{
ctx.beginPath();
ctx.arc(p.x,p.y,p.s,0,Math.PI*2);
ctx.fill();
}
});
ctx.globalAlpha=1;
requestAnimationFrame(animationLoop);
}
requestAnimationFrame(animationLoop);
function characterDelay(wpm){
return 60000/(wpm*5);
}
async function typeText(element,text,wpm){
element.style.visibility='visible';
element.textContent='';
const delay=characterDelay(wpm);
for(let i=0;i<text.length;i++){
element.textContent=text.substring(0,i+1);
let extra=0;
if(/[.!?]/.test(text[i]))extra=delay*.8;
else if(/[,;:]/.test(text[i]))extra=delay*.35;
await sleep(delay+extra);
}
}
function ensureAudio(){
if(audio)return;
audio=new Audio(MUSIC_FILE);
audio.loop=true;
audio.volume=.55;
audio.preload='auto';
}
async function playMusic(){
ensureAudio();
try{
await audio.play();
playing=true;
$('music').textContent='❚❚ Musiqi';
}catch(error){
playing=false;
$('music').textContent='♫ Musiqini aç';
}
}
function activateLastFiveEffects(){
$('bP').style.opacity='1';
$('bG').style.opacity='1';
$('rays').classList.add('on');
petalsOn=true;
confetti(W/2,H*.55);
fireworks(4);
burst(W/2,H*.5,70,6);
}
function showBigNumber(number){
$('final').style.display='flex';
$('bigNum').textContent=number;
$('bigNum').style.animation='none';
void $('bigNum').offsetWidth;
$('bigNum').style.animation='beat .8s ease-out';
$('final').style.background='radial-gradient(circle,rgba(72,15,95,.97),rgba(10,2,18,.99))';
burst(W/2,H/2,45,6);
if(number===5){
confetti(W/2,H*.65);
fireworks(5);
}else if(number===4){
fireworks(4);
}else if(number===3){
fireworks(3);
}else if(number===2){
fireworks(2);
}else if(number===1){
fireworks(5);
confetti(W/2,H*.55);
}
}
async function start(){
if(started)return;
started=true;
clearInterval(countdownTimer);
$('final').style.display='none';
$('wait').style.display='none';
$('celeb').style.display='block';
$('card').classList.remove('hide');
$('card').classList.add('glow');
$('music').style.display='block';
playMusic();
$('greet').style.opacity='1';
await sleep(250);
$('bP').style.opacity='1';
$('bG').style.opacity='1';
$('rays').classList.add('on');
petalsOn=true;
const title=$('celeb').querySelector('h1');
title.style.opacity='1';
title.style.transform='scale(1)';
title.style.textShadow='0 0 35px rgba(255,209,102,.5)';
burst(W/2,H*.35,70,5);
fireworks(5);
await sleep(500);
await playPoem();
}
async function playPoem(){
const lines=[...document.querySelectorAll('.pl')];
for(let i=0;i<lines.length;i++){
const line=lines[i];
const text=line.getAttribute('data-text')||line.textContent;
line.style.visibility='visible';
line.classList.add('on');
if(i===8){
$('dim').classList.add('on');
$('eyes').classList.add('on');
$('card').classList.add('glow');
line.classList.add('eyeline');
}
if(i===9){
line.classList.add('eyeline');
}
await typeText(line,text,POEM_WPM);
if(i===1||i===5||i===7){
await sleep(250);
}else{
await sleep(120);
}
if(i===8){
await sleep(500);
}
if(i===9){
await sleep(700);
$('dim').classList.remove('on');
$('eyes').classList.remove('on');
}
}
$('closing').classList.add('in');
await sleep(350);
$('flowers').classList.add('in');
await sleep(500);
$('wishbox').classList.add('in');
setTimeout(revealSecret,8000);
}
function revealSecret(){
$('secretBtn').style.display='inline-block';
requestAnimationFrame(()=>{
requestAnimationFrame(()=>{
$('secretBtn').classList.add('in');
});
});
}
$('cake').addEventListener('click',()=>{
if($('cake').classList.contains('out'))return;
$('cake').classList.add('out');
const rect=$('cake').getBoundingClientRect();
confetti(rect.left+rect.width/2,rect.top+rect.height*.3);
fireworks(6);
setTimeout(()=>{
$('wishmsg').textContent='Diləyin gerçək olsun. ❤️';
},500);
setTimeout(revealSecret,1800);
});
$('secretBtn').onclick=()=>{
$('secret').style.display='flex';
requestAnimationFrame(()=>{
requestAnimationFrame(()=>{
$('secret').classList.add('on');
});
});
burst(W/2,H/2,50,4);
};
$('secretClose').onclick=()=>{
$('secret').classList.remove('on');
setTimeout(()=>$('secret').style.display='none',900);
};
$('music').onclick=async()=>{
ensureAudio();
if(playing){
audio.pause();
playing=false;
$('music').textContent='♫ Musiqini aç';
}else{
await playMusic();
}
};
document.addEventListener('pointerdown',()=>{
if(started&&!playing)playMusic();
});
document.addEventListener('keydown',()=>{
if(started&&!playing)playMusic();
});
function updateCountdown(){
if(started)return;
const difference=Math.max(0,targetTime-Date.now());
const days=Math.floor(difference/86400000);
const hours=Math.floor((difference%86400000)/3600000);
const minutes=Math.floor((difference%3600000)/60000);
const seconds=Math.floor((difference%60000)/1000);
$('d').textContent=String(days).padStart(2,'0');
$('h').textContent=String(hours).padStart(2,'0');
$('m').textContent=String(minutes).padStart(2,'0');
$('s').textContent=String(seconds).padStart(2,'0');
}
function countdownTick(){
if(started)return;
const difference=targetTime-Date.now();
if(difference<=0){
$('d').textContent='00';
$('h').textContent='00';
$('m').textContent='00';
$('s').textContent='00';
$('final').style.display='none';
clearInterval(countdownTimer);
start();
return;
}
updateCountdown();
const secondsLeft=Math.ceil(difference/1000);
if(secondsLeft<=5){
if(secondsLeft!==lastBigSecond){
lastBigSecond=secondsLeft;
activateLastFiveEffects();
showBigNumber(secondsLeft);
}
}else{
lastBigSecond=null;
}
}
function initialize(){
if(IS_OPEN){
start();
return;
}
if(IS_DEMO){
targetTime=Date.now()+10000;
}
updateCountdown();
countdownTick();
countdownTimer=setInterval(countdownTick,50);
}
initialize();
</script>
